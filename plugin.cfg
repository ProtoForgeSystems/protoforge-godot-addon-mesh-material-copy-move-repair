[plugin]
name="ProtoForge Sidecar"
description="Move and copy .gltf files with their .bin and textures. Godot's dependency graph cannot see files a glTF references by URI, so the FileSystem dock moves the .gltf alone and breaks it. This carries the dependencies, and repairs assets a past move already broke."
author="ProtoForge Systems"
version="0.1.0"
script="plugin.gd"
