[plugin]
name="ProtoForge Mesh+Material Copy/Move/Repair"
description="glTF files reference their .bin and textures by URI, which Godot's dependency graph cannot see — so moving or copying a .gltf in the FileSystem dock leaves those files behind and breaks the asset. This carries them along, and repairs a model a past move already broke."
author="ProtoForge Systems"
version="1.1.0"
script="plugin.gd"
